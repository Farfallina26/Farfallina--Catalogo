<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farfallina — Catálogo de libros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFF7EC;
    --paper-2: #FCEFDD;
    --card: #FFFFFF;
    --ink: #2E2A45;
    --ink-soft: rgba(46,42,69,0.62);
    --coral: #FF8B6A;
    --leaf: #3E9C6E;
    --leaf-dark: #2F7E57;
    --gold: #F2B441;
    --plum: #8B6FB3;
    --sky: #5B9BD8;
    --line: rgba(46,42,69,0.10);
    --danger: #D9534F;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
  }

  /* ---------- Encabezado ---------- */

  .hero{
    text-align:center;
    padding: 5vh 6vw 3rem;
    position:relative;
    overflow:hidden;
  }

  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 12% 10%, var(--paper-2) 0%, transparent 42%),
      radial-gradient(circle at 90% 25%, var(--paper-2) 0%, transparent 40%);
    z-index:-1;
  }

  .logo{
    width: min(210px, 46vw);
    height:auto;
    margin-bottom: -0.4rem;
  }

  .subtitle{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    color: var(--leaf-dark);
    margin: 0 0 0.35rem;
  }

  .tagline{
    font-size: 0.98rem;
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 auto 1.6rem;
  }

  .whatsapp-btn{
    display:inline-flex;
    align-items:center;
    gap: 0.55rem;
    background: var(--leaf);
    color: #fff;
    text-decoration:none;
    font-family:'Nunito', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 0.8rem 1.6rem;
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--leaf-dark), 0 10px 22px rgba(46,42,69,0.16);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: none;
    cursor: pointer;
  }

  .whatsapp-btn:hover{ transform: translateY(-2px); }
  .whatsapp-btn:active{ transform: translateY(2px); box-shadow: 0 3px 0 var(--leaf-dark), 0 6px 14px rgba(46,42,69,0.16); }
  .whatsapp-btn svg{ width: 20px; height: 20px; flex-shrink:0; }

  /* ---------- Barra de filtros ---------- */

  .toolbar{
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255,247,236,0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 0.9rem 6vw;
    display:flex;
    flex-wrap:wrap;
    gap: 0.7rem;
    align-items:center;
  }

  .search-wrap{
    position:relative;
    flex: 1 1 220px;
    max-width: 340px;
  }

  .search-wrap input{
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size: 0.95rem;
    padding: 0.6rem 0.9rem 0.6rem 2.2rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    outline: none;
  }

  .search-wrap input:focus{ border-color: var(--leaf); }

  .search-wrap svg{
    position:absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    opacity: 0.45;
  }

  .chips{
    display:flex;
    gap: 0.45rem;
    flex-wrap: wrap;
    flex: 1 1 auto;
  }

  .chip{
    font-family:'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .chip:hover{ border-color: var(--leaf); }

  .chip.active{
    background: var(--leaf);
    border-color: var(--leaf);
    color: #fff;
  }

  .count{
    font-size: 0.82rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .toolbar-right{
    display:flex;
    align-items:center;
    gap: 0.6rem;
    margin-left:auto;
  }

  .tool-btn{
    display:inline-flex;
    align-items:center;
    gap: 0.4rem;
    font-family:'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }

  .tool-btn.primary{
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .tool-btn svg{ width: 14px; height: 14px; }

  /* ---------- Catálogo ---------- */

  main{ padding: 2rem 6vw 5rem; }

  .section-title{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.3rem, 2.6vw, 1.7rem);
    margin: 2.4rem 0 1rem;
    display:flex;
    align-items:baseline;
    gap: 0.6rem;
  }

  .section-title .n{
    font-family:'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--ink-soft);
    background: var(--paper-2);
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 1.1rem;
  }

  .card{
    background: var(--card);
    border-radius: 16px;
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    display:flex;
    flex-direction:column;
    position: relative;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(46,42,69,0.12);
  }

  .cover{
    aspect-ratio: 3 / 4;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .cover .letter{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 2.6rem;
    color: rgba(255,255,255,0.92);
  }

  .card-body{
    padding: 0.8rem 0.85rem 0.95rem;
    display:flex;
    flex-direction:column;
    gap: 0.3rem;
    flex:1;
  }

  .card-title{
    font-size: 0.87rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
    min-height: 2.2em;
  }

  .card-autor{
    font-size: 0.74rem;
    color: var(--ink-soft);
    margin-top:-0.2rem;
  }

  .card-cat{
    font-size: 0.7rem;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .card-bottom{
    margin-top: auto;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 0.4rem;
    padding-top: 0.4rem;
  }

  .price{
    font-family:'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.92rem;
    color: var(--leaf-dark);
  }

  .ask-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width: 30px;
    height: 30px;
    border-radius: 999px;
    background: var(--paper-2);
    color: var(--leaf-dark);
    text-decoration:none;
    flex-shrink:0;
    transition: background 0.15s ease;
  }

  .ask-link:hover{ background: var(--leaf); color:#fff; }
  .ask-link svg{ width: 15px; height: 15px; }

  .edit-controls{
    position:absolute;
    top: 0.5rem;
    right: 0.5rem;
    display:none;
    gap: 0.35rem;
    z-index: 2;
  }

  body.edit-mode .edit-controls{ display:flex; }

  .edit-controls button{
    width: 28px;
    height: 28px;
    border-radius: 999px;
    border: none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background: rgba(255,255,255,0.92);
    color: var(--ink);
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }

  .edit-controls button.del{ color: var(--danger); }
  .edit-controls svg{ width: 14px; height:14px; }

  .empty{
    text-align:center;
    padding: 3rem 1rem;
    color: var(--ink-soft);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.1rem;
    display:none;
  }

  footer{
    text-align:center;
    font-size: 0.78rem;
    color: var(--ink-soft);
    padding: 0 0 3rem;
  }

  /* ---------- Modo edición: botón flotante ---------- */

  .edit-toggle{
    position: fixed;
    bottom: 1.3rem;
    right: 1.3rem;
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    border: none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 8px 20px rgba(46,42,69,0.3);
    z-index: 40;
    opacity: 0.55;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .edit-toggle:hover{ opacity: 1; }
  .edit-toggle svg{ width: 20px; height: 20px; }
  body.edit-mode .edit-toggle{ background: var(--leaf-dark); opacity: 1; }

  /* ---------- Modal ---------- */

  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(46,42,69,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 1.5rem;
    z-index: 50;
  }

  .modal-backdrop.open{ display:flex; }

  .modal{
    background: var(--paper);
    border-radius: 20px;
    max-width: 460px;
    width: 100%;
    max-height: 88vh;
    overflow-y:auto;
    padding: 1.6rem;
    box-shadow: 0 30px 60px rgba(0,0,0,0.3);
  }

  .modal h3{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.3rem;
    margin: 0 0 1rem;
  }

  .isbn-row{
    display:flex;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }

  .isbn-row input{ flex:1; }

  .isbn-msg{
    font-size: 0.78rem;
    min-height: 1.1em;
    margin: 0 0 0.9rem;
    color: var(--ink-soft);
  }
  .isbn-msg.ok{ color: var(--leaf-dark); }
  .isbn-msg.err{ color: var(--danger); }

  .field{ margin-bottom: 0.9rem; }
  .field label{
    display:block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 0.3rem;
  }
  .field input, .field select{
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size: 0.92rem;
    padding: 0.55rem 0.7rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    background:#fff;
    color: var(--ink);
    outline:none;
  }
  .field input:focus, .field select:focus{ border-color: var(--leaf); }

  .cover-preview{
    width: 64px;
    height: 86px;
    border-radius: 8px;
    background: var(--paper-2);
    object-fit: cover;
    margin-top: 0.4rem;
    display:none;
  }

  .modal-actions{
    display:flex;
    gap: 0.6rem;
    margin-top: 1.2rem;
  }

  .btn{
    font-family:'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 0.65rem 1.1rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor:pointer;
  }
  .btn.primary{ background: var(--leaf); border-color: var(--leaf); color:#fff; margin-left:auto; }
  .btn.danger{ background: #fff; border-color: var(--danger); color: var(--danger); }

  .toast{
    position: fixed;
    bottom: 1.4rem;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: #fff;
    padding: 0.7rem 1.2rem;
    border-radius: 999px;
    font-size: 0.86rem;
    font-weight: 700;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 520px){
    .toolbar{ padding: 0.8rem 5vw; }
    .count{ display:none; }
    main{ padding: 1.6rem 5vw 4rem; }
    .toolbar-right{ width:100%; justify-content: space-between; margin-left:0; }
  }
</style>
</head>

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

function formatPrecio(p){
  if (p === null || p === undefined || p === "") return "Consultar";
  return "$" + Number(p).toLocaleString('es-AR');
}

function waLink(titulo){
  const msg = encodeURIComponent("Hola! Quería consultar por el libro \"" + titulo + "\" del catálogo de Farfallina.");
  return "https://wa.me/5493400000000?text=" + msg;
}

function findBookById(id){
  for (const seccion of CATALOGO){
    const libro = seccion.libros.find(l => l.id === id);
    if (libro) return { seccion, libro };
  }
  return null;
}

function deleteBookById(id){
  for (const seccion of CATALOGO){
    const idx = seccion.libros.findIndex(l => l.id === id);
    if (idx > -1){ seccion.libros.splice(idx, 1); return; }
  }
}

function buildChips(){
  const nombres = ["Todas", ...CATALOGO.map(s => s.categoria)];
  chipsEl.innerHTML = nombres.map(n =>
    `<button class="chip${n===activeCategoria ? ' active' : ''}" data-cat="${n}">${n}</button>`
  ).join('');
  chipsEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategoria = btn.dataset.cat;
      render();
    });
  });
}

function render(){
  let totalVisible = 0;
  let html = "";

  CATALOGO.forEach((seccion, si) => {
    if (activeCategoria !== "Todas" && seccion.categoria !== activeCategoria) return;

    const libros = seccion.libros.filter(l =>
      l.titulo.toLowerCase().includes(searchTerm)
    );
    if (libros.length === 0) return;

    totalVisible += libros.length;
    const color = PALETA[si % PALETA.length];

    html += `<h2 class="section-title">${seccion.categoria} <span class="n">${libros.length}</span></h2>`;
    html += `<div class="grid">`;
    libros.forEach(libro => {
      const inicial = libro.titulo.trim().charAt(0).toUpperCase();
      const cover = libro.portada
        ? `<img src="${libro.portada}" alt="Tapa de ${libro.titulo}" style="width:100%;height:100%;object-fit:cover;" onerror="this.remove()">`
        : `<div class="letter">${inicial}</div>`;
      html += `
        <div class="card" data-id="${libro.id}">
          <div class="edit-controls">
            <button class="edit" type="button" data-action="edit" data-id="${libro.id}" title="Editar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="del" type="button" data-action="delete" data-id="${libro.id}" title="Eliminar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6h12Z"/></svg>
            </button>
          </div>
          <div class="cover" style="background:${color};">${cover}</div>
          <div class="card-body">
            <div class="card-title">${libro.titulo}</div>
            ${libro.autor ? `<div class="card-autor">${libro.autor}</div>` : ''}
            <div class="card-cat">${seccion.categoria}</div>
            <div class="card-bottom">
              <span class="price">${formatPrecio(libro.precio)}</span>
              <a class="ask-link" href="${waLink(libro.titulo)}" target="_blank" rel="noopener noreferrer" title="Consultar por WhatsApp">
                <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                  <path d="M16.02 3C9.4 3 4 8.36 4 15c0 2.34.64 4.53 1.76 6.4L4 29l7.78-1.7A11.9 11.9 0 0 0 16.02 27C22.64 27 28 21.64 28 15S22.64 3 16.02 3Zm0 21.8c-1.98 0-3.83-.56-5.4-1.53l-.39-.23-4.62 1 .99-4.5-.25-.41A9.7 9.7 0 0 1 6.2 15c0-5.42 4.4-9.82 9.82-9.82 5.42 0 9.82 4.4 9.82 9.82 0 5.42-4.4 9.8-9.82 9.8Z"/>
                </svg>
              </a>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  catalogEl.innerHTML = html;
  emptyEl.style.display = totalVisible === 0 ? 'block' : 'none';
  countEl.textContent = totalVisible + (totalVisible === 1 ? " libro" : " libros");

  catalogEl.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.addEventListener('click', () => openModal(btn.dataset.id));
  });
  catalogEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const found = findBookById(btn.dataset.id);
      if (found && confirm(`¿Eliminar "${found.libro.titulo}" del catálogo?`)){
        deleteBookById(btn.dataset.id);
        render();
        toast("Libro eliminado");
      }
    });
  });
}

    fAutor.value = found.libro.autor || '';
    fPrecio.value = found.libro.precio ?? '';
    fPortada.value = found.libro.portada || '';
    fillCategoriaSelect(found.seccion.categoria);
    deleteBtn.style.display = 'inline-flex';
    if (found.libro.portada){
      fPortadaPreview.src = found.libro.portada;
      fPortadaPreview.style.display = 'inline-block';
    }
  } else {
    modalTitle.textContent = 'Agregar libro';
    fTitulo.value = '';
    fAutor.value = '';
    fPrecio.value = '';
    fPortada.value = '';
    fillCategoriaSelect(activeCategoria !== 'Todas' ? activeCategoria : null);
    deleteBtn.style.display = 'none';
  }

  modalBackdrop.classList.add('open');
}

function closeModal(){
  modalBackdrop.classList.remove('open');
  editingId = null;
}

addBookBtn.addEventListener('click', () => openModal(null));

/* ---------- Buscar por ISBN (Google Books API) ---------- */

async function buscarEnGoogleBooks(isbn){
  const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
  if (!res.ok) throw new Error('google books http ' + res.status);
  const data = await res.json();
  if (!data.totalItems) return null;
  const info = data.items[0].volumeInfo;
  return {
    titulo: info.title || '',
    autor: (info.authors || []).join(', '),
    portada: info.imageLinks && info.imageLinks.thumbnail
      ? info.imageLinks.thumbnail.replace('http://', 'https://')
      : ''
  };
}

async function buscarEnOpenLibrary(isbn){
  const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
  if (!res.ok) throw new Error('open library http ' + res.status);
  const data = await res.json();
  const info = data['ISBN:' + isbn];
  if (!info) return null;
  return {
    titulo: info.title || '',
    autor: (info.authors || []).map(a => a.name).join(', '),
    portada: info.cover ? (info.cover.large || info.cover.medium || info.cover.small || '') : ''
  };
}

isbnSearchBtn.addEventListener('click', async () => {
  const isbn = isbnInput.value.replace(/[^0-9Xx]/g, '');
  if (!isbn){
    isbnMsg.textContent = 'Escribí un ISBN para buscar.';
    isbnMsg.className = 'isbn-msg err';
    return;
  }
  isbnMsg.textContent = 'Buscando…';
  isbnMsg.className = 'isbn-msg';

  let resultado = null;
  let huboError = false;

  try {
    resultado = await buscarEnGoogleBooks(isbn);
  } catch (err){ huboError = true; }

  if (!resultado){
    try {
      resultado = await buscarEnOpenLibrary(isbn);
      huboError = false;
    } catch (err){ huboError = true; }
  }

  if (resultado){
    if (resultado.titulo) fTitulo.value = resultado.titulo;
    if (resultado.autor) fAutor.value = resultado.autor;
    if (resultado.portada){
      fPortada.value = resultado.portada;
      fPortadaPreview.src = resultado.portada;
      fPortadaPreview.style.display = 'inline-block';
    }
    isbnMsg.textContent = 'Encontrado — revisá los datos antes de guardar.';
    isbnMsg.className = 'isbn-msg ok';
  } else if (huboError){
    isbnMsg.textContent = 'No se pudo buscar (revisá tu conexión). Cargá los datos a mano.';
    isbnMsg.className = 'isbn-msg err';
  } else {
    isbnMsg.textContent = 'No se encontró ese ISBN. Cargá los datos a mano.';
    isbnMsg.className = 'isbn-msg err';
  }
});

/* ---------- Guardar / eliminar libro ---------- */

saveBtn.addEventListener('click', () => {
  const titulo = fTitulo.value.trim();
  const autor = fAutor.value.trim();
  const precio = fPrecio.value === '' ? null : Number(fPrecio.value);
  const portada = fPortada.value.trim();

  let categoriaNombre = fCategoria.value;
  if (categoriaNombre === '__nueva__'){
    categoriaNombre = fNuevaCategoria.value.trim();
  }

  if (!titulo || !categoriaNombre){
    toast('Falta el título o la categoría');
    return;
  }

  // Si estábamos editando, primero sacamos el libro de su sección actual
  let libroObj;
  if (editingId){
    const found = findBookById(editingId);
    libroObj = found.libro;
    deleteBookById(editingId);
  } else {
    libroObj = { id: 'b' + Date.now().toString(36) + '-' + Math.floor(Math.random()*1000) };
  }

  libroObj.titulo = titulo;
  libroObj.autor = autor;
  libroObj.precio = precio;
  libroObj.portada = portada;

  // Buscamos (o creamos) la sección destino, sin duplicar por mayúsculas/espacios
  let seccion = CATALOGO.find(s => s.categoria.trim().toLowerCase() === categoriaNombre.trim().toLowerCase());
  if (!seccion){
    seccion = { categoria: categoriaNombre, libros: [] };
    CATALOGO.push(seccion);
  }
  seccion.libros.push(libroObj);

  closeModal();
  buildChips();
  render();
  toast(editingId ? 'Libro actualizado' : 'Libro agregado');
});

deleteBtn.addEventListener('click', () => {
  if (editingId && confirm('¿Eliminar este libro del catálogo?')){
    deleteBookById(editingId);
    closeModal();
    buildChips();
    render();
    toast('Libro eliminado');
  }
});

/* ---------- Descargar página actualizada ---------- */

downloadBtn.addEventListener('click', () => {
  const nuevoJson = JSON.stringify(CATALOGO, null, 2);
  const htmlActual = document.documentElement.outerHTML;
  const marcador = /\/\*CATALOGO_START\*\/[\s\S]*?\/\*CATALOGO_END\*\//;
  const nuevoBloque = '/*CATALOGO_START*/\nconst CATALOGO = ' + nuevoJson + ';\n/*CATALOGO_END*/';
  const htmlNuevo = '<!DOCTYPE html>\n' + htmlActual.replace(marcador, nuevoBloque);

  const blob = new Blob([htmlNuevo], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'farfallina.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Descargando página actualizada…');
});

buildChips();
render();
</script>
